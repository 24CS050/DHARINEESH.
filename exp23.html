<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Integration</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    text-align:center;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
}

button{
    background:#007BFF;
    color:white;
    border:none;
    padding:10px 20px;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.card{
    background:white;
    margin:10px;
    padding:15px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}
</style>
</head>
<body>

<div class="container">

    <h1>API Integration Example</h1>

    <button onclick="getUsers()">
        Load Users
    </button>

    <div id="users"></div>

</div>

<script>
async function getUsers() {

    try {
        const response = await fetch(
            "https://jsonplaceholder.typicode.com/users"
        );

        const data = await response.json();

        let output = "";

        data.forEach(user => {
            output += `
                <div class="card">
                    <h3>${user.name}</h3>
                    <p>Email: ${user.email}</p>
                    <p>Phone: ${user.phone}</p>
                    <p>Website: ${user.website}</p>
                </div>
            `;
        });

        document.getElementById("users").innerHTML = output;

    } catch(error) {
        document.getElementById("users").innerHTML =
            "<p>Failed to load data.</p>";
    }
}
</script>

</body>
</html>
