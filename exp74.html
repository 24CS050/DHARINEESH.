<!DOCTYPE html>
<html>
<head>
    <title>API Testing Demo</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            text-align:center;
            margin-top:50px;
        }
        button{
            padding:10px 20px;
            font-size:16px;
        }
        pre{
            text-align:left;
            width:80%;
            margin:20px auto;
            background:#f4f4f4;
            padding:15px;
            border-radius:5px;
        }
    </style>
</head>
<body>

<h2>API Testing Example</h2>

<button onclick="loadData()">Get User Data</button>

<pre id="output">Click the button to load data...</pre>

<script>
async function loadData() {
    try {
        const response = await fetch(
            "https://jsonplaceholder.typicode.com/users/1"
        );

        const data = await response.json();

        document.getElementById("output").textContent =
            JSON.stringify(data, null, 2);

    } catch(error) {
        document.getElementById("output").textContent =
            "Error: " + error.message;
    }
}
</script>

</body>
</html>
