<!DOCTYPE html>
<html>
<head>
    <title>Student Record System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #eaeaea;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Record Management System</h2>

    <input type="text" id="rollNo" placeholder="Roll Number">
    <input type="text" id="studentName" placeholder="Student Name">
    <input type="text" id="course" placeholder="Course">
    <input type="number" id="marks" placeholder="Marks">
    <button onclick="addStudent()">Add Student</button>

    <br>

    <input type="text" id="search" placeholder="Search Student"
           onkeyup="displayStudents()">

    <table>
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
                <th>Grade</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>
</div>

<script>
let students =
JSON.parse(localStorage.getItem("students")) || [];

function saveStudents() {
    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );
}

function calculateGrade(marks) {
    if (marks >= 90) return "A";
    if (marks >= 75) return "B";
    if (marks >= 60) return "C";
    if (marks >= 40) return "D";
    return "F";
}

function addStudent() {
    const rollNo =
        document.getElementById("rollNo").value.trim();

    const name =
        document.getElementById("studentName").value.trim();

    const course =
        document.getElementById("course").value.trim();

    const marks =
        parseInt(document.getElementById("marks").value);

    if (!rollNo || !name || !course || isNaN(marks)) {
        alert("Please fill all fields.");
        return;
    }

    students.push({
        rollNo,
        name,
        course,
        marks
    });

    saveStudents();
    displayStudents();

    document.getElementById("rollNo").value = "";
    document.getElementById("studentName").value = "";
    document.getElementById("course").value = "";
    document.getElementById("marks").value = "";
}

function displayStudents() {
    const search =
        document.getElementById("search")
        .value.toLowerCase();

    const table =
        document.getElementById("studentTable");

    table.innerHTML = "";

    students
    .filter(student =>
        student.name.toLowerCase().includes(search) ||
        student.rollNo.toLowerCase().includes(search)
    )
    .forEach((student, index) => {

        table.innerHTML += `
        <tr>
            <td>${student.rollNo}</td>
            <td>${student.name}</td>
            <td>${student.course}</td>
            <td>${student.marks}</td>
            <td>${calculateGrade(student.marks)}</td>
            <td>
                <button onclick="editStudent(${index})">
                    Edit
                </button>
                <button onclick="deleteStudent(${index})">
                    Delete
                </button>
            </td>
        </tr>`;
    });
}

function editStudent(index) {
    let newMarks = prompt(
        "Enter New Marks:",
        students[index].marks
    );

    if (newMarks !== null) {
        students[index].marks = parseInt(newMarks);
        saveStudents();
        displayStudents();
    }
}

function deleteStudent(index) {
    if (confirm("Delete this student?")) {
        students.splice(index, 1);
        saveStudents();
        displayStudents();
    }
}

displayStudents();
</script>

</body>
</html>
