<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:20px;
}

h1{
    text-align:center;
}

.products{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
}

.product{
    background:white;
    padding:15px;
    width:220px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:10px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.cart{
    margin-top:30px;
    background:white;
    padding:20px;
    border-radius:10px;
    max-width:600px;
    margin-left:auto;
    margin-right:auto;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.cart-item{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
}
</style>
</head>
<body>

<h1>Shopping Cart Demo</h1>

<div class="products">

    <div class="product">
        <h3>Wireless Headphones</h3>
        <p>₹1999</p>
        <button onclick="addToCart('Wireless Headphones',1999)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Smart Watch</h3>
        <p>₹2499</p>
        <button onclick="addToCart('Smart Watch',2499)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Bluetooth Speaker</h3>
        <p>₹1299</p>
        <button onclick="addToCart('Bluetooth Speaker',1299)">
            Add to Cart
        </button>
    </div>

</div>

<div class="cart">
    <h2>Cart Items</h2>
    <div id="cartItems"></div>
    <h3>Total: ₹<span id="total">0</span></h3>
</div>

<script>
let cart = [];
let total = 0;

function addToCart(name, price){
    cart.push({name, price});
    total += price;
    displayCart();
}

function removeItem(index){
    total -= cart[index].price;
    cart.splice(index,1);
    displayCart();
}

function displayCart(){
    let cartItems = document.getElementById("cartItems");
    cartItems.innerHTML = "";

    cart.forEach((item,index)=>{
        cartItems.innerHTML += `
            <div class="cart-item">
                <span>${item.name} - ₹${item.price}</span>
                <button onclick="removeItem(${index})">
                    Remove
                </button>
            </div>
        `;
    });

    document.getElementById("total").innerText = total;
}
</script>

</body>
</html>
