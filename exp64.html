<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
}

.container{
    width:400px;
    margin:30px auto;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    padding:15px;
}

h2{
    text-align:center;
}

#chatArea{
    height:300px;
    border:1px solid #ccc;
    overflow-y:auto;
    padding:10px;
    margin-bottom:10px;
}

.user{
    text-align:right;
    color:blue;
    margin:5px;
}

.bot{
    text-align:left;
    color:green;
    margin:5px;
}

input{
    width:75%;
    padding:10px;
}

button{
    padding:10px;
}
</style>
</head>

<body>

<div class="container">
    <h2>Simple Chatbot</h2>

    <div id="chatArea">
        <div class="bot">Bot: Hello! Type a message.</div>
    </div>

    <input type="text" id="message" placeholder="Enter message">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
function sendMessage(){

    let input = document.getElementById("message");
    let text = input.value.trim();

    if(text === ""){
        alert("Please enter a message");
        return;
    }

    let chatArea = document.getElementById("chatArea");

    chatArea.innerHTML +=
        "<div class='user'>You: " + text + "</div>";

    let reply;

    switch(text.toLowerCase()){

        case "hello":
            reply = "Hi! Welcome.";
            break;

        case "how are you":
            reply = "I am fine. Thank you!";
            break;

        case "help":
            reply = "Available commands: hello, help, bye";
            break;

        case "bye":
            reply = "Goodbye!";
            break;

        default:
            reply = "Sorry, I don't understand.";
    }

    setTimeout(function(){
        chatArea.innerHTML +=
            "<div class='bot'>Bot: " + reply + "</div>";

        chatArea.scrollTop = chatArea.scrollHeight;
    }, 500);

    input.value = "";
}
</script>

</body>
</html>
