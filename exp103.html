<!DOCTYPE html>
<html>
<head>
    <title>Banking Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #eaeaea;
        }

        .deposit {
            background: green;
            color: white;
            border: none;
        }

        .withdraw {
            background: orange;
            color: white;
            border: none;
        }

        .delete {
            background: red;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Banking Application</h2>

    <input type="text" id="name" placeholder="Account Holder Name">
    <input type="number" id="balance" placeholder="Opening Balance">
    <button onclick="createAccount()">Create Account</button>

    <table>
        <thead>
            <tr>
                <th>Account No</th>
                <th>Name</th>
                <th>Balance (₹)</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="accountTable"></tbody>
    </table>
</div>

<script>
let accounts =
JSON.parse(localStorage.getItem("accounts")) || [];

function saveAccounts() {
    localStorage.setItem(
        "accounts",
        JSON.stringify(accounts)
    );
}

function createAccount() {
    const name =
        document.getElementById("name").value.trim();

    const balance =
        parseFloat(
            document.getElementById("balance").value
        );

    if (!name || isNaN(balance)) {
        alert("Enter valid details");
        return;
    }

    accounts.push({
        accountNo: Date.now(),
        name: name,
        balance: balance
    });

    saveAccounts();
    displayAccounts();

    document.getElementById("name").value = "";
    document.getElementById("balance").value = "";
}

function displayAccounts() {
    const table =
        document.getElementById("accountTable");

    table.innerHTML = "";

    accounts.forEach((account, index) => {
        table.innerHTML += `
        <tr>
            <td>${account.accountNo}</td>
            <td>${account.name}</td>
            <td>₹${account.balance.toFixed(2)}</td>
            <td>
                <button class="deposit"
                    onclick="depositMoney(${index})">
                    Deposit
                </button>

                <button class="withdraw"
                    onclick="withdrawMoney(${index})">
                    Withdraw
                </button>

                <button class="delete"
                    onclick="deleteAccount(${index})">
                    Delete
                </button>
            </td>
        </tr>`;
    });
}

function depositMoney(index) {
    let amount = prompt("Enter deposit amount:");

    amount = parseFloat(amount);

    if (!isNaN(amount) && amount > 0) {
        accounts[index].balance += amount;
        saveAccounts();
        displayAccounts();
    }
}

function withdrawMoney(index) {
    let amount = prompt("Enter withdrawal amount:");

    amount = parseFloat(amount);

    if (isNaN(amount) || amount <= 0) {
        return;
    }

    if (amount > accounts[index].balance) {
        alert("Insufficient balance!");
        return;
    }

    accounts[index].balance -= amount;

    saveAccounts();
    displayAccounts();
}

function deleteAccount(index) {
    if (confirm("Delete this account?")) {
        accounts.splice(index, 1);
        saveAccounts();
        displayAccounts();
    }
}

displayAccounts();
</script>

</body>
</html>
