<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings Management</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.settings-container{
    width:400px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.setting-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid #ddd;
}

.setting-item:last-child{
    border-bottom:none;
}

.setting-item label{
    font-size:16px;
    color:#555;
}

input[type="checkbox"]{
    width:20px;
    height:20px;
}

select{
    padding:5px;
    border-radius:5px;
}

.save-btn{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.save-btn:hover{
    background:#0056b3;
}
</style>
</head>
<body>

<div class="settings-container">
    <h2>Settings</h2>

    <div class="setting-item">
        <label>Dark Mode</label>
        <input type="checkbox">
    </div>

    <div class="setting-item">
        <label>Notifications</label>
        <input type="checkbox" checked>
    </div>

    <div class="setting-item">
        <label>Language</label>
        <select>
            <option>English</option>
            <option>Hindi</option>
            <option>Tamil</option>
        </select>
    </div>

    <div class="setting-item">
        <label>Email Alerts</label>
        <input type="checkbox">
    </div>

    <button class="save-btn">Save Settings</button>
</div>

</body>
</html>
