<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>State Management Example</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 100px;
    background-color: #6b05f1;
}

.container {
    background: rgb(59, 241, 4);
    padding: 20px;
    width: 300px;
    margin: auto;
    border-radius: 10px;
    box-shadow: 0 0 10px rgb(244, 5, 204);
}

button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    background: #07c8eb;
    color: rgb(249, 237, 4);
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #0056b3;
}

h2 {
    color: green;
}
</style>
</head>
<body>

<div class="container">
    <h1>State Management Demo</h1>

    <h2 id="count">0</h2>

    <button onclick="increment()">Increment</button>
    <button onclick="decrement()">Decrement</button>
    <button onclick="resetCount()">Reset</button>
</div>

<script>

// Application State
let state = {
    count: 0
};

// Render UI
function render() {
    document.getElementById("count").innerText = state.count;
}

// Update State
function increment() {
    state.count++;
    render();
}

function decrement() {
    state.count--;
    render();
}

function resetCount() {
    state.count = 0;
    render();
}

// Initial Render
render();

</script>

</body>
</html>
