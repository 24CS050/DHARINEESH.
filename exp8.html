<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Management</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.container {
    width: 400px;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

.profile-image {
    text-align: center;
    margin-bottom: 20px;
}

.profile-image img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #3498db;
}

h2 {
    text-align: center;
    color: #333;
}

label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #2980b9;
}

#message {
    text-align: center;
    margin-top: 15px;
    color: green;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <div class="profile-image">
        <img src="https://via.placeholder.com/120" alt="Profile">
    </div>

    <h2>Profile Management</h2>

    <form id="profileForm">
        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Phone Number</label>
        <input type="tel" id="phone" required>

        <label>Address</label>
        <textarea id="address" rows="3" required></textarea>

        <button type="submit">Update Profile</button>
    </form>

    <p id="message"></p>

</div>

<script>
document.getElementById("profileForm").addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("message").innerHTML =
        "Profile Updated Successfully!";
});
</script>

</body>
</html>
