<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Task Processing</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f5f5f5;
        padding: 20px;
    }

    .container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        background: #4CAF50;
        color: white;
        border-radius: 5px;
        cursor: pointer;
    }

    #status {
        margin-top: 20px;
        text-align: left;
        background: #222;
        color: #00ff00;
        padding: 15px;
        border-radius: 5px;
        min-height: 180px;
        white-space: pre-line;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Background Task Processing</h1>

    <p>Simulate processing tasks in the background.</p>

    <button onclick="startTask()">Start Task</button>

    <div id="status">Waiting for task...</div>
</div>

<script>
function startTask() {
    const status = document.getElementById("status");

    status.innerHTML = "Task added to queue...\n";

    setTimeout(() => {
        status.innerHTML += "Worker picked up task...\n";
    }, 1000);

    setTimeout(() => {
        status.innerHTML += "Processing data...\n";
    }, 2500);

    setTimeout(() => {
        status.innerHTML += "Saving results...\n";
    }, 4000);

    setTimeout(() => {
        status.innerHTML += "✅ Background task completed successfully!";
    }, 5500);
}
</script>

</body>
</html>
