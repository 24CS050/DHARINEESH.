<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Listing Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#007bff;
    color:white;
    text-align:center;
    padding:15px;
}

.container{
    width:90%;
    margin:20px auto;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 8px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.card h3{
    margin-bottom:10px;
}

.price{
    color:green;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.btn{
    display:block;
    width:100%;
    padding:10px;
    border:none;
    background:#007bff;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

.btn:hover{
    background:#0056b3;
}
</style>
</head>
<body>

<header>
    <h1>Product Listing Page</h1>
</header>

<div class="container">
    <div class="products">

        <div class="card">
            <img src="https://picsum.photos/300/200?random=1" alt="Product 1">
            <div class="card-content">
                <h3>Wireless Headphones</h3>
                <p class="price">₹1,999</p>
                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=2" alt="Product 2">
            <div class="card-content">
                <h3>Smart Watch</h3>
                <p class="price">₹2,499</p>
                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=3" alt="Product 3">
            <div class="card-content">
                <h3>Bluetooth Speaker</h3>
                <p class="price">₹1,299</p>
                <button class="btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=4" alt="Product 4">
            <div class="card-content">
                <h3>Gaming Mouse</h3>
                <p class="price">₹899</p>
                <button class="btn">Add to Cart</button>
            </div>
        </div>

    </div>
</div>

</body>
</html>
