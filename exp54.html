<!DOCTYPE html>
<html>
<head>
    <title>Payment Gateway Integration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Payment Gateway</h2>

    <form id="paymentForm">
        <input type="text" id="name" placeholder="Card Holder Name" required>

        <input type="text" id="card" placeholder="Card Number" maxlength="16" required>

        <input type="month" id="expiry" required>

        <input type="password" id="cvv" placeholder="CVV" maxlength="3" required>

        <input type="number" id="amount" placeholder="Amount" required>

        <button type="submit">Pay Now</button>
    </form>

    <div id="message"></div>
</div>

<script>
document.getElementById("paymentForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const amount = document.getElementById("amount").value;

    document.getElementById("message").innerHTML =
        "✅ Payment of ₹" + amount + " processed successfully!";
});
</script>

</body>
</html>
