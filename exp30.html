<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blogging Platform</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#007bff;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:1200px;
    margin:20px auto;
}

.blog-form{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.blog-form input,
.blog-form textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

.blog-form button{
    background:#28a745;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

.blog-form button:hover{
    background:#218838;
}

.blogs{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.blog-card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.blog-card h3{
    margin-bottom:10px;
}

.blog-card p{
    color:#555;
}

.blog-card button{
    margin-top:15px;
    background:#dc3545;
    color:rgb(70, 252, 20);
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

.blog-card button:hover{
    background:#c5e606;
}

footer{
    background:#0913dd;
    color:rgb(123, 6, 233);
    text-align:center;
    padding:15px;
    margin-top:30px;
}
</style>
</head>
<body>

<header>
    <h1>My Blogging Platform</h1>
</header>

<div class="container">

    <div class="blog-form">
        <h2>Create New Blog</h2>

        <input type="text" id="title" placeholder="Blog Title">

        <textarea id="content" rows="5"
        placeholder="Write your blog content..."></textarea>

        <button onclick="addBlog()">Publish Blog</button>
    </div>

    <div class="blogs" id="blogList"></div>

</div>

<footer>
    <p>&copy; 2026 Blogging Platform</p>
</footer>

<script>
function addBlog() {
    let title = document.getElementById("title").value;
    let content = document.getElementById("content").value;

    if(title === "" || content === "") {
        alert("Please fill all fields");
        return;
    }

    let blogCard = document.createElement("div");
    blogCard.className = "blog-card";

    blogCard.innerHTML = `
        <h3>${title}</h3>
        <p>${content}</p>
        <button onclick="deleteBlog(this)">Delete</button>
    `;

    document.getElementById("blogList").prepend(blogCard);

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
}

function deleteBlog(button) {
    button.parentElement.remove();
}
</script>

</body>
</html>
