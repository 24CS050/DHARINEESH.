<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: green;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Forgot Password</h2>

    <input type="email" id="email" placeholder="Enter Email Address" required>

    <button onclick="resetPassword()">Send Reset Link</button>

    <p id="message"></p>
</div>

<script>
function resetPassword() {
    let email = document.getElementById("email").value;
    let message = document.getElementById("message");

    if(email === "") {
        message.style.color = "red";
        message.innerHTML = "Please enter your email!";
        return;
    }

    message.style.color = "green";
    message.innerHTML =
        "Password reset link sent to: " + email;
}
</script>

</body>
</html>
