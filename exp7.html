<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        .sidebar{
            width:250px;
            height:100vh;
            background:#2c3e50;
            position:fixed;
            color:white;
        }

        .sidebar h2{
            text-align:center;
            padding:20px;
            background:#1a252f;
        }

        .sidebar ul{
            list-style:none;
        }

        .sidebar ul li{
            padding:15px 20px;
            border-bottom:1px solid #34495e;
            cursor:pointer;
        }

        .sidebar ul li:hover{
            background:#34495e;
        }

        .main-content{
            margin-left:250px;
            padding:20px;
        }

        .header{
            background:white;
            padding:15px;
            border-radius:8px;
            box-shadow:0 2px 5px rgba(0,0,0,0.2);
            margin-bottom:20px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            padding:20px;
            text-align:center;
            border-radius:8px;
            box-shadow:0 2px 5px rgba(0,0,0,0.2);
        }

        .card h3{
            color:#555;
        }

        .card p{
            font-size:28px;
            color:#3498db;
            margin-top:10px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            margin-top:20px;
            border-radius:8px;
            overflow:hidden;
        }

        th,td{
            padding:12px;
            border:1px solid #ddd;
            text-align:left;
        }

        th{
            background:#3498db;
            color:white;
        }

        @media(max-width:768px){
            .sidebar{
                width:100%;
                height:auto;
                position:relative;
            }

            .main-content{
                margin-left:0;
            }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>Admin Panel</h2>
    <ul>
        <li>Dashboard</li>
        <li>Users</li>
        <li>Products</li>
        <li>Orders</li>
        <li>Reports</li>
        <li>Settings</li>
        <li>Logout</li>
    </ul>
</div>

<div class="main-content">

    <div class="header">
        <h2>Welcome Admin</h2>
    </div>

    <div class="cards">
        <div class="card">
            <h3>Total Users</h3>
            <p>1500</p>
        </div>

        <div class="card">
            <h3>Total Orders</h3>
            <p>780</p>
        </div>

        <div class="card">
            <h3>Products</h3>
            <p>320</p>
        </div>

        <div class="card">
            <h3>Revenue</h3>
            <p>₹75,000</p>
        </div>
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Status</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Rahul</td>
            <td>Active</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Priya</td>
            <td>Inactive</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Arun</td>
            <td>Active</td>
        </tr>
    </table>

</div>

</body>
</html>
