<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Integration Frontend</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.payment-container{
    background:#fff;
    width:400px;
    padding:25px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.row{
    display:flex;
    gap:10px;
}

.row .input-group{
    flex:1;
}

.pay-btn{
    width:100%;
    padding:12px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

.pay-btn:hover{
    background:#218838;
}

.total{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
    color:#444;
}
</style>
</head>
<body>

<div class="payment-container">

    <h2>Payment Gateway</h2>

    <div class="total">
        Amount: ₹17,100
    </div>

    <div class="input-group">
        <label>Card Holder Name</label>
        <input type="text" id="holder">
    </div>

    <div class="input-group">
        <label>Card Number</label>
        <input type="text" id="card" maxlength="16">
    </div>

    <div class="row">
        <div class="input-group">
            <label>Expiry Date</label>
            <input type="text" id="expiry" placeholder="MM/YY">
        </div>

        <div class="input-group">
            <label>CVV</label>
            <input type="password" id="cvv" maxlength="3">
        </div>
    </div>

    <button class="pay-btn" onclick="makePayment()">
        Pay Now
    </button>

</div>

<script>
function makePayment() {

    let holder = document.getElementById("holder").value;
    let card = document.getElementById("card").value;
    let expiry = document.getElementById("expiry").value;
    let cvv = document.getElementById("cvv").value;

    if(holder === "" || card === "" || expiry === "" || cvv === ""){
        alert("Please fill all fields!");
        return;
    }

    if(card.length !== 16){
        alert("Card number must be 16 digits!");
        return;
    }

    if(cvv.length !== 3){
        alert("CVV must be 3 digits!");
        return;
    }

    alert("Payment Successful! 🎉");
}
</script>

</body>
</html>
