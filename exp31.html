<!DOCTYPE html>
<html>
<head>
    <title>REST API Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <h2>REST API Demo</h2>

    <button onclick="getUsers()">Get Users</button>

    <div id="result"></div>

    <script>
        function getUsers() {
            fetch('https://jsonplaceholder.typicode.com/users')
                .then(response => response.json())
                .then(data => {
                    let output = "<h3>User List</h3>";

                    data.forEach(user => {
                        output += `
                            <p>
                                <strong>${user.name}</strong><br>
                                Email: ${user.email}
                            </p>
                        `;
                    });

                    document.getElementById("result").innerHTML = output;
                })
                .catch(error => {
                    document.getElementById("result").innerHTML =
                        "Error loading data";
                });
        }
    </script>

</body>
</html>
