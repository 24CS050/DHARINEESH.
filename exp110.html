<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    background:#f4f6f9;
}

.sidebar{
    width:250px;
    height:100vh;
    background:#1f2937;
    color:white;
    padding:20px;
}

.sidebar h2{
    margin-bottom:20px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    padding:12px;
    cursor:pointer;
    border-radius:5px;
}

.sidebar ul li:hover{
    background:#374151;
}

.main{
    flex:1;
    padding:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card h3{
    margin-bottom:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

table th,table td{
    border:1px solid #ddd;
    padding:12px;
}

table th{
    background:#2563eb;
    color:white;
}

button{
    padding:8px 15px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="sidebar">
    <h2>Enterprise ERP</h2>

    <ul>
        <li>Dashboard</li>
        <li>Employees</li>
        <li>Departments</li>
        <li>Attendance</li>
        <li>Payroll</li>
        <li>Reports</li>
    </ul>
</div>

<div class="main">

    <h1>Enterprise Dashboard</h1>

    <div class="cards">
        <div class="card">
            <h3>Total Employees</h3>
            <h2 id="employees">150</h2>
        </div>

        <div class="card">
            <h3>Departments</h3>
            <h2>12</h2>
        </div>

        <div class="card">
            <h3>Monthly Revenue</h3>
            <h2>$50,000</h2>
        </div>

        <div class="card">
            <h3>Projects</h3>
            <h2>25</h2>
        </div>
    </div>

    <h2>Employee Records</h2>
    <br>

    <button onclick="addEmployee()">
        Add Employee
    </button>

    <br><br>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
            </tr>
        </thead>

        <tbody id="employeeTable">
            <tr>
                <td>1</td>
                <td>John</td>
                <td>IT</td>
            </tr>
        </tbody>
    </table>

</div>

<script>
let count = 1;

function addEmployee(){

    count++;

    let table =
    document.getElementById("employeeTable");

    let row =
    `
    <tr>
        <td>${count}</td>
        <td>Employee ${count}</td>
        <td>IT</td>
    </tr>
    `;

    table.innerHTML += row;

    document.getElementById("employees")
    .innerText = 150 + count;
}
</script>

</body>
</html>
