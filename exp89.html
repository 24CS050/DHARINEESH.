<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reusable Backend Modules</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f4f4f4;
        padding: 20px;
    }

    .container {
        max-width: 800px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
    }

    .module {
        display: inline-block;
        width: 180px;
        margin: 10px;
        padding: 15px;
        background: #2196F3;
        color: white;
        border-radius: 8px;
    }

    button {
        padding: 10px 20px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    #output {
        margin-top: 20px;
        font-weight: bold;
        color: green;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Reusable Backend Modules</h1>

    <div class="module">Authentication Module</div>
    <div class="module">Database Module</div>
    <div class="module">Logging Module</div>
    <div class="module">Email Module</div>

    <br><br>

    <button onclick="loadModules()">
        Load Modules
    </button>

    <p id="output"></p>
</div>

<script>
function loadModules() {
    document.getElementById("output").innerHTML =
        "✅ Authentication, Database, Logging and Email Modules Loaded Successfully!";
}
</script>

</body>
</html>
