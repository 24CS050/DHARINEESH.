<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navigation Bar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        .navbar{
            background:#10e805;
            overflow:hidden;
        }

        .navbar a{
            float:left;
            display:block;
            color:rgb(17, 28, 235);
            text-align:center;
            padding:14px 20px;
            text-decoration:none;
        }

        .navbar a:hover{
            background:#07e0ef;
        }

        .navbar .icon{
            display:none;
        }

        @media screen and (max-width:768px){

            .navbar a:not(:first-child){
                display:none;
            }

            .navbar a.icon{
                float:right;
                display:block;
            }

            .navbar.responsive{
                position:relative;
            }

            .navbar.responsive .icon{
                position:absolute;
                right:0;
                top:0;
            }

            .navbar.responsive a{
                float:none;
                display:block;
                text-align:left;
            }
        }
    </style>
</head>

<body>

<div class="navbar" id="myNavbar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Products</a>
    <a href="#">Contact</a>
    <a href="javascript:void(0);" class="icon" onclick="toggleMenu()">
        ☰
    </a>
</div>

<div style="padding:20px;">
    <h1>Responsive Navigation Bar</h1>
    <p>Resize the browser window to see the responsive menu.</p>
</div>

<script>
function toggleMenu() {
    var nav = document.getElementById("myNavbar");

    if (nav.className === "navbar") {
        nav.className += " responsive";
    } else {
        nav.className = "navbar";
    }
}
</script>

</body>
</html>
