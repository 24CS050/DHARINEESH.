<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Mode Demo</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: white;
    color: black;
    transition: 0.3s;
}

.header {
    background: #007bff;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    width: 80%;
    max-width: 500px;
    margin: 50px auto;
    padding: 20px;
    text-align: center;
    background: #f5f5f5;
    border-radius: 10px;
    box-shadow: 0 0 10px gray;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

/* Dark Mode */
.dark {
    background: #121212;
    color: white;
}

.dark .container {
    background: #1f1f1f;
    color: white;
}

.dark .header {
    background: #222;
}
</style>
</head>
<body>

<div class="header">
    <h1>Dark Mode Feature</h1>
</div>

<div class="container">
    <h2>Welcome</h2>
    <p>Click the button below to enable or disable Dark Mode.</p>

    <button onclick="changeTheme()">Toggle Dark Mode</button>
</div>

<script>
function changeTheme() {
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
