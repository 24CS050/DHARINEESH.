<!DOCTYPE html>
<html>
<head>
    <title>AI Chat Integration</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
        }

        #chatBox{
            border:1px solid #ccc;
            height:300px;
            overflow-y:auto;
            padding:10px;
            margin-bottom:10px;
        }

        input{
            width:75%;
            padding:10px;
        }

        button{
            padding:10px;
        }

        .user{
            color:blue;
            margin:5px 0;
        }

        .bot{
            color:green;
            margin:5px 0;
        }
    </style>
</head>
<body>

<h2>AI Chatbot</h2>

<div id="chatBox"></div>

<input type="text" id="userInput" placeholder="Type your message">
<button onclick="sendMessage()">Send</button>

<script>
async function sendMessage() {

    const input = document.getElementById("userInput");
    const message = input.value.trim();

    if(message === "") return;

    const chatBox = document.getElementById("chatBox");

    chatBox.innerHTML +=
        `<div class="user"><b>You:</b> ${message}</div>`;

    input.value = "";

    try {

        // Replace with your API URL
        const response = await fetch(
            "https://your-api-url.com/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            }
        );

        const data = await response.json();

        chatBox.innerHTML +=
            `<div class="bot"><b>AI:</b> ${data.reply}</div>`;

        chatBox.scrollTop = chatBox.scrollHeight;

    } catch(error) {

        chatBox.innerHTML +=
            `<div class="bot"><b>AI:</b> Error connecting to API</div>`;
    }
}
</script>

</body>
</html>
