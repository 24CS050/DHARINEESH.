<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Commerce Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
}

/* Navbar */
.navbar{
    background:#007bff;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
}

.navbar ul{
    list-style:none;
    display:flex;
}

.navbar ul li{
    margin-left:20px;
}

.navbar ul li a{
    color:white;
    text-decoration:none;
}

/* Hero Section */
.hero{
    text-align:center;
    padding:60px 20px;
    background:white;
}

.hero h1{
    margin-bottom:10px;
}

.hero p{
    color:#555;
}

/* Product Section */
.products{
    width:90%;
    margin:30px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content{
    padding:15px;
    text-align:center;
}

.price{
    color:green;
    font-size:18px;
    font-weight:bold;
    margin:10px 0;
}

.btn{
    background:#007bff;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

.btn:hover{
    background:#0056b3;
}

/* Footer */
footer{
    background:#222;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}
</style>
</head>
<body>

<div class="navbar">
    <h2>ShopEasy</h2>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Cart</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</div>

<section class="hero">
    <h1>Welcome to ShopEasy</h1>
    <p>Find the best products at affordable prices.</p>
</section>

<section class="products">

    <div class="card">
        <img src="https://picsum.photos/300/200?1" alt="Product">
        <div class="card-content">
            <h3>Wireless Headphones</h3>
            <p class="price">₹1,999</p>
            <button class="btn">Add to Cart</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?2" alt="Product">
        <div class="card-content">
            <h3>Smart Watch</h3>
            <p class="price">₹2,499</p>
            <button class="btn">Add to Cart</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?3" alt="Product">
        <div class="card-content">
            <h3>Bluetooth Speaker</h3>
            <p class="price">₹1,299</p>
            <button class="btn">Add to Cart</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?4" alt="Product">
        <div class="card-content">
            <h3>Gaming Mouse</h3>
            <p class="price">₹899</p>
            <button class="btn">Add to Cart</button>
        </div>
    </div>

</section>

<footer>
    <p>&copy; 2026 ShopEasy. All Rights Reserved.</p>
</footer>

</body>
</html>
