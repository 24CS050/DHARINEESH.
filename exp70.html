<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            text-align: center;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <h2>URL Shortener</h2>

    <input type="text" id="longUrl" placeholder="Enter URL">
    <br>

    <button onclick="shortenUrl()">Shorten URL</button>

    <div id="result"></div>

    <script>
        function shortenUrl() {
            let url = document.getElementById("longUrl").value;

            if (url === "") {
                alert("Please enter a URL");
                return;
            }

            let shortCode = Math.random().toString(36).substring(2, 8);

            document.getElementById("result").innerHTML =
                "Short URL: <br>" +
                "https://short.ly/" + shortCode;
        }
    </script>

</body>
</html>
