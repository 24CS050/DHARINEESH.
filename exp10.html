<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reusable UI Components</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        /* Navbar */
        .navbar{
            background:#007bff;
            color:white;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .navbar ul{
            list-style:none;
            display:flex;
        }

        .navbar ul li{
            margin-left:20px;
        }

        .navbar ul li a{
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        /* Card */
        .container{
            display:flex;
            justify-content:center;
            align-items:center;
            height:80vh;
        }

        .card{
            background:white;
            width:350px;
            padding:20px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
            text-align:center;
        }

        .card h2{
            margin-bottom:10px;
        }

        .card p{
            margin-bottom:15px;
            color:#555;
        }

        /* Input */
        .input-field{
            width:100%;
            padding:10px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        /* Buttons */
        .btn{
            padding:10px 15px;
            border:none;
            border-radius:5px;
            color:white;
            cursor:pointer;
            margin:5px;
        }

        .primary{
            background:#007bff;
        }

        .success{
            background:#28a745;
        }

        .danger{
            background:#dc3545;
        }

        .btn:hover{
            opacity:0.9;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>MyApp</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>

    <!-- Card -->
    <div class="container">
        <div class="card">
            <h2>User Profile</h2>
            <p>Reusable UI Components Example</p>

            <input type="text" class="input-field" placeholder="Enter your name">

            <button class="btn primary">Save</button>
            <button class="btn success">Update</button>
            <button class="btn danger">Delete</button>
        </div>
    </div>

</body>
</html>
